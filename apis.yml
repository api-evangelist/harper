aid: harper
name: Harper
description: 'Harper is an AI-native commercial insurance brokerage founded in 2024 and headquartered
  in San Francisco. Harper pairs licensed insurance experts with a proprietary AI tech stack that
  automates core brokerage workflows — reading applications, routing submissions, following up with
  underwriters, and managing client communications — to place excess & surplus (E&S) and specialty
  commercial coverage across industries from trucking and construction to technology, CPG, and
  professional services. Businesses can get bound coverage in 24-48 hours rather than weeks. The
  company is backed by Emergence Capital and Y Combinator and raised a $47M Series A and seed round in
  early 2026. Harper does not currently publish a public developer API; this profile tracks the
  company''s identity and public web surface for the API Evangelist network.'
